[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schematic-investigator"
version = "0.4.0"
description = "Local, evidence-first vector schematic PDF investigation"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24,<2"]

[project.scripts]
schematic-investigator = "schematic_investigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
